name: Generate Snake

on:
  schedule: # a cada 12 horas
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    name: Gera a animação da cobrinha
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generate snake SVG
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#7fbf6f&color_dots=#161b22,#1c3a1a,#2f5f28,#4e8a41,#7fbf6f
            dist/github-snake-light.svg?palette=github-light&color_snake=#3d8b35&color_dots=#e2e0d6,#c3ddb9,#8cc47e,#4e8a41,#2e6b28

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
